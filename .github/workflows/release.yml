name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tagged commit is in main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install patchelf
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes patchelf

      - name: Create Linux build environment
        if: runner.os == 'Linux'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Create Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install -r requirements.txt
          .venv\Scripts\python.exe -m pip install -r requirements-build.txt

      - name: Run Linux tests
        if: runner.os == 'Linux'
        run: .venv/bin/python -m pytest

      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: .venv\Scripts\python.exe -m pytest

      - name: Build Linux standalone app
        if: runner.os == 'Linux'
        run: scripts/build_nuitka_unix.sh

      - name: Build Windows standalone app
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts\build_nuitka_windows.ps1

      - name: Package Linux archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release/Shardveil
          cp -R build/nuitka/Shardveil.dist/. release/Shardveil/
          tar -czf Shardveil-linux-x64.tar.gz -C release Shardveil

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release\Shardveil
          Copy-Item -Recurse -Force build\nuitka\Shardveil.dist\* release\Shardveil
          Compress-Archive -Path release\Shardveil -DestinationPath Shardveil-windows-x64.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: Shardveil-${{ matrix.platform }}
          path: Shardveil-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --generate-notes
